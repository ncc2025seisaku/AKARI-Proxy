name: Windows Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: '0.0.0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.11.1

      - name: Get Flutter dependencies
        working-directory: akari_flutter
        run: flutter pub get

      - name: Run code generation
        working-directory: akari_flutter
        run: flutter_rust_bridge_codegen generate

      - name: Setup Cargokit build tool
        shell: pwsh
        run: |
          # Install cargokit build_tool dependencies
          cd akari_flutter/rust_builder/cargokit/build_tool
          dart pub get
        
      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $version = $Matches[1]
          } else {
            $version = "${{ github.event.inputs.version }}"
            if (-not $version) { $version = "0.0.0" }
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Build Windows Release
        working-directory: akari_flutter
        run: flutter build windows --release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          pip install pyinstaller maturin
          pip install .

      - name: Build Python Backend
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --distpath release/backend --name akari_backend --onedir --contents-directory . scripts/run_async_remote_proxy.py

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $flutterBuildDir = "akari_flutter/build/windows/x64/runner/Release"
          $pythonBuildDir = "release/backend/akari_backend"
          $zipName = "akari-proxy-windows-$version.zip"
          
          # Create strict release structure
          $releaseRoot = "release_package"
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null
          
          # Copy Flutter artifacts to root
          Copy-Item -Recurse "$flutterBuildDir/*" $releaseRoot
          
          # Copy Python artifacts to backend folder
          $backendDest = "$releaseRoot/backend"
          New-Item -ItemType Directory -Force -Path $backendDest | Out-Null
          Copy-Item -Recurse "$pythonBuildDir/*" $backendDest
          
          Compress-Archive -Path "$releaseRoot/*" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: akari-proxy-windows-*.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: akari-proxy-windows-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
