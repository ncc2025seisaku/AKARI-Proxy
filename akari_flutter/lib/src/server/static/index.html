<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Akari Web Proxy</title>
  <style>
    :root {
      color-scheme: dark;
      --text: #f6f2ea;
      --muted: rgba(246, 242, 234, 0.65);
      --accent: #f3c45c;
      font-family: "Inter", "SF Pro Display", "Yu Gothic", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      text-rendering: optimizeLegibility;
      padding: 2rem;
      overflow: hidden;
      transition: background 0.25s ease;
      background-attachment: fixed;
      background: #0a0a0a;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("logo.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: min(100vw, 100vh);
      opacity: 0.3;
      filter: blur(1.5px) brightness(1.25);
      mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 1) 48%, rgba(0, 0, 0, 0) 72%);
      mask-mode: alpha;
      transform: translateY(-2%);
      pointer-events: none;
      transition: filter 0.25s ease, opacity 0.25s ease;
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at center, rgba(10, 10, 10, 0) 40%, rgba(10, 10, 10, 0.35) 70%, rgba(10, 10, 10, 0.75) 90%, rgba(10, 10, 10, 0.95) 95%, rgba(10, 10, 10, 0) 100%),
        radial-gradient(circle, rgba(10, 10, 10, 0.15), rgba(10, 10, 10, 0));
      mix-blend-mode: soft-light;
      z-index: -1;
    }

    body.focused::before {
      opacity: 0.12;
      filter: blur(8px);
    }

    main {
      position: relative;
      width: min(520px, 100%);
      max-width: 520px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.3rem;
    }

    .liquid-glass {
      width: min(460px, 90vw);
      border-radius: 56px;
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 1.15rem;
      border: none;
      background: none;
      padding: 2.25rem 2.5rem 1.75rem;
      margin: 0 auto;
      text-decoration: none;
    }

    .input-area {
      width: 100%;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      position: relative;
      padding: 0.9rem 1rem;
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      overflow: hidden;
      isolation: isolate;
    }

    .input-area canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .input-area>input,
    .input-area>button {
      position: relative;
      z-index: 1;
    }

    .input-area input {
      flex: 1;
      border: 1px solid transparent;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.3);
      box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.3);
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 500;
      padding: 0.35rem 0.5rem;
      line-height: 1.6;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .input-area input::placeholder {
      color: rgba(246, 242, 234, 0.75);
    }

    .input-area input:focus-visible {
      border-color: rgba(243, 196, 92, 0.9);
      box-shadow: 0 0 0 2px rgba(243, 196, 92, 0.3);
      background: rgba(0, 0, 0, 0.4);
      outline: none;
    }

    .input-area button {
      border: none;
      border-radius: 14px;
      padding: 0.65rem 1.4rem;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.05rem;
      background: linear-gradient(135deg, rgba(255, 216, 137, 0.95), rgba(191, 141, 41, 0.9));
      color: #08060a;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15), 0 10px 24px rgba(223, 140, 41, 0.45);
    }

    .input-area button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 26px rgba(223, 140, 41, 0.55);
    }

    .input-area button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 209, 106, 0.45), 0 16px 26px rgba(223, 140, 41, 0.4);
    }

    .input-area button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .input-area button.loading {
      position: relative;
      color: transparent;
    }

    .input-area button.loading::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      top: 50%;
      left: 50%;
      margin-top: -8px;
      margin-left: -8px;
      border: 2px solid rgba(8, 6, 10, 0.3);
      border-top-color: #08060a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    body.focused .input-area {
      border-color: rgba(255, 255, 255, 0.6);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    #sourceImage {
      display: none;
    }

    .hint-text {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

    /* 検索結果スタイル */
    .search-results {
      display: none;
      width: min(700px, 95vw);
      margin-top: 1.5rem;
      text-align: left;
    }

    .search-results.active {
      display: block;
    }

    .search-query-info {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      padding: 0 0.5rem;
    }

    .search-result {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 1rem 1.2rem;
      margin-bottom: 0.8rem;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .search-result:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(243, 196, 92, 0.3);
    }

    .search-result-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.4rem;
    }

    .search-result-favicon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .search-result-site {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .search-result-domain {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .search-result-url {
      font-size: 0.7rem;
      color: #7cb342;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.85;
    }

    .search-result-title {
      font-size: 1.15rem;
      color: var(--accent);
      text-decoration: none;
      display: block;
      margin-bottom: 0.35rem;
      font-weight: 500;
      line-height: 1.3;
    }

    .search-result-title:hover {
      text-decoration: underline;
    }

    .search-result-snippet {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .no-results {
      color: var(--muted);
      text-align: center;
      padding: 2rem;
    }

    .back-button {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      transition: border-color 0.2s ease;
    }

    .back-button:hover {
      border-color: var(--accent);
    }

    @media (max-width: 520px) {
      body {
        padding: 1.2rem;
      }

      .liquid-glass {
        padding: 1.6rem 1.4rem 1.2rem;
      }

      .input-area {
        flex-direction: column;
        gap: 0.65rem;
      }

      .input-area button {
        width: 100%;
        padding: 0.55rem 0;
      }
    }
  </style>
</head>

<body>
  <main>
    <div id="searchPanel" class="liquid-glass">
      <label class="sr-only" for="query"></label>
      <div class="input-area">
        <canvas id="glassCanvas"></canvas>
        <input id="query" name="query" type="text" placeholder="URLまたは検索キーワードを入力..." autocomplete="off" />
        <button id="submitSearch" type="button">アクセス</button>
      </div>
      <p class="hint-text">URLはそのままアクセス · 検索キーワードはWeb検索 · Enter実行</p>
    </div>
  </main>
  <!-- 検索結果エリア -->
  <div id="searchResults" class="search-results"></div>
  <img id="sourceImage" style="display: none;" alt="" />
  <script id="fragShader" type="x-shader/x-fragment">
      precision mediump float;

      uniform vec3 iResolution;
      uniform float iTime;
      uniform sampler2D iChannel0;

      void mainImage(out vec4 fragColor, in vec2 fragCoord)
      {
        const float NUM_ZERO = 0.0;
        const float NUM_ONE = 1.0;
        const float NUM_HALF = 0.5;
        const float LENS_STRENGTH = 0.012;
        const float SAMPLE_RANGE = 3.0;
        const float SAMPLE_OFFSET = 0.4;
        const float EDGE_FADE = 0.06;
        const float LIGHTING_INTENSITY = 0.18;

        vec2 uv = fragCoord / iResolution.xy;
        
        vec2 edgeDist = min(uv, NUM_ONE - uv);
        float edgeFactor = smoothstep(NUM_ZERO, EDGE_FADE, min(edgeDist.x, edgeDist.y));
        
        vec2 center = vec2(NUM_HALF, NUM_HALF);
        vec2 toCenter = uv - center;
        
        vec2 lens = uv + toCenter * LENS_STRENGTH * edgeFactor;
        
        fragColor = vec4(NUM_ZERO);
        float total = NUM_ZERO;
        for (float x = -SAMPLE_RANGE; x <= SAMPLE_RANGE; x++) {
          for (float y = -SAMPLE_RANGE; y <= SAMPLE_RANGE; y++) {
            vec2 offset = vec2(x, y) * SAMPLE_OFFSET / iResolution.xy;
            fragColor += texture2D(iChannel0, offset + lens);
            total += NUM_ONE;
          }
        }
        fragColor /= total;
        
        float gradient = smoothstep(-NUM_HALF, NUM_HALF, toCenter.y) * edgeFactor;
        fragColor += vec4(gradient * LIGHTING_INTENSITY) * edgeFactor;
      }

      void main() {
        mainImage(gl_FragColor, gl_FragCoord.xy);
      }
    </script>
  <script>
    const queryInput = document.getElementById("query");
    const searchButton = document.getElementById("submitSearch");
    const canvas = document.getElementById("glassCanvas");
    const inputArea = document.querySelector(".input-area");
    const img = document.getElementById("sourceImage");
    const gl = canvas.getContext("webgl");

    const updateFocusState = () => {
      const active = document.activeElement === queryInput || queryInput.value.trim().length > 0;
      document.body.classList.toggle("focused", active);
    };

    queryInput.addEventListener("focus", updateFocusState);
    queryInput.addEventListener("blur", updateFocusState);
    queryInput.addEventListener("input", updateFocusState);
    updateFocusState();

    const normalizeUrl = (text) => {
      // スキーム付きURL
      if (/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(text)) {
        return { type: 'url', value: text };
      }
      // ドットを含み、空白がない場合はURLとみなす
      if (text.includes(".") && !text.includes(" ")) {
        return { type: 'url', value: `https://${text}` };
      }
      // それ以外は検索クエリ
      return { type: 'search', value: text };
    };

    const searchResultsEl = document.getElementById('searchResults');

    const escapeHtml = (text) => {
      if (text == null) return '';
      const div = document.createElement('div');
      div.textContent = String(text);
      return div.innerHTML;
    };

    // URLが安全かどうか検証（https/http のみ許可）
    const isValidUrl = (url) => {
      if (!url || typeof url !== 'string') return false;
      try {
        const parsed = new URL(url);
        return parsed.protocol === 'https:' || parsed.protocol === 'http:';
      } catch {
        return false;
      }
    };

    // 検索結果を描画（DOM操作で安全に構築）
    const renderSearchResults = (data) => {
      const { query, results } = data;

      // コンテナをクリア
      searchResultsEl.innerHTML = '';

      // 戻るボタン
      const backBtn = document.createElement('button');
      backBtn.className = 'back-button';
      backBtn.textContent = '← 戻る';
      backBtn.onclick = hideSearchResults;
      searchResultsEl.appendChild(backBtn);

      // 検索クエリ情報
      const queryInfo = document.createElement('div');
      queryInfo.className = 'search-query-info';
      queryInfo.textContent = `「${query}」の検索結果 (${results.length}件)`;
      searchResultsEl.appendChild(queryInfo);

      if (results.length === 0) {
        const noResults = document.createElement('div');
        noResults.className = 'no-results';
        noResults.textContent = '検索結果が見つかりませんでした';
        searchResultsEl.appendChild(noResults);
      } else {
        for (const r of results) {
          const resultDiv = document.createElement('div');
          resultDiv.className = 'search-result';

          // ヘッダー部分
          const header = document.createElement('div');
          header.className = 'search-result-header';

          // favicon（URLを検証）
          if (isValidUrl(r.favicon)) {
            const favicon = document.createElement('img');
            favicon.className = 'search-result-favicon';
            favicon.src = r.favicon;
            favicon.alt = '';
            favicon.onerror = function() { this.style.display = 'none'; };
            header.appendChild(favicon);
          }

          // サイト情報
          const siteDiv = document.createElement('div');
          siteDiv.className = 'search-result-site';

          const domain = document.createElement('span');
          domain.className = 'search-result-domain';
          domain.textContent = r.domain || '';
          siteDiv.appendChild(domain);

          const urlSpan = document.createElement('span');
          urlSpan.className = 'search-result-url';
          urlSpan.textContent = r.url || '';
          siteDiv.appendChild(urlSpan);

          header.appendChild(siteDiv);
          resultDiv.appendChild(header);

          // タイトルリンク
          const titleLink = document.createElement('a');
          titleLink.className = 'search-result-title';
          titleLink.href = `/${encodeURIComponent(r.url)}`;
          titleLink.textContent = r.title || '';
          resultDiv.appendChild(titleLink);

          // スニペット
          const snippet = document.createElement('div');
          snippet.className = 'search-result-snippet';
          snippet.textContent = r.snippet || '';
          resultDiv.appendChild(snippet);

          searchResultsEl.appendChild(resultDiv);
        }
      }

      searchResultsEl.classList.add('active');
      document.querySelector('main').style.display = 'none';
    };

    const hideSearchResults = () => {
      searchResultsEl.classList.remove('active');
      searchResultsEl.innerHTML = '';
      document.querySelector('main').style.display = 'flex';
      queryInput.value = '';
      queryInput.focus();
    };
    window.hideSearchResults = hideSearchResults;

    const openProxy = () => {
      const text = queryInput.value.trim();
      if (!text) {
        queryInput.focus();
        return;
      }
      const result = normalizeUrl(text);

      // ローディング状態を表示
      searchButton.classList.add('loading');
      searchButton.disabled = true;
      queryInput.disabled = true;

      if (result.type === 'search') {
        // 検索クエリの場合 - fetchでJSON取得
        fetch(`/search?q=${encodeURIComponent(result.value)}`)
          .then(res => {
            if (!res.ok) {
              throw new Error(`HTTP ${res.status}`);
            }
            return res.json();
          })
          .then(data => {
            renderSearchResults(data);
          })
          .catch(err => {
            console.error('Search failed:', err);
            // インラインでエラー表示
            searchResultsEl.innerHTML = '';
            const errorDiv = document.createElement('div');
            errorDiv.className = 'no-results';
            errorDiv.textContent = '検索に失敗しました。しばらくしてから再度お試しください。';
            searchResultsEl.appendChild(errorDiv);
            searchResultsEl.classList.add('active');
          })
          .finally(() => {
            searchButton.classList.remove('loading');
            searchButton.disabled = false;
            queryInput.disabled = false;
          });
      } else {
        // URLの場合 - ページ遷移
        const params = new URLSearchParams();
        params.set("entry", "1");
        window.location.href = `/${encodeURIComponent(result.value)}?${params.toString()}`;
      }
    };

    searchButton.addEventListener("click", openProxy);
    queryInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        openProxy();
      }
    });

    // WebGL Setup
    const captureBackground = () => {
      const rect = inputArea.getBoundingClientRect();
      const tempCanvas = document.createElement('canvas');
      const ctx = tempCanvas.getContext('2d');

      tempCanvas.width = rect.width;
      tempCanvas.height = rect.height;

      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

      const logoImg = new Image();
      logoImg.src = 'logo.png';
      logoImg.onload = () => {
        ctx.globalAlpha = 0.24;
        ctx.filter = 'blur(1.5px)';
        const logoSize = Math.min(rect.width, rect.height) * 0.8;
        ctx.drawImage(
          logoImg,
          (rect.width - logoSize) / 2,
          (rect.height - logoSize) / 2 - rect.height * 0.02,
          logoSize,
          logoSize
        );
        img.src = tempCanvas.toDataURL();
      };

      logoImg.onerror = () => {
        img.src = tempCanvas.toDataURL();
      };

      return tempCanvas;
    };

    const setCanvasSize = () => {
      const rect = inputArea.getBoundingClientRect();
      const width = Math.max(1, Math.floor(rect.width));
      const height = Math.max(1, Math.floor(rect.height));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;

        const bgCanvas = captureBackground();
        img.src = bgCanvas.toDataURL();
      }
    };

    const adjustLayout = () => {
      setCanvasSize();
    };

    adjustLayout();
    window.addEventListener("resize", adjustLayout);

    if (!gl) {
      console.error("WebGL がサポートされていません。");
    } else {
      const vsSource = `
          attribute vec2 position;
          void main() {
            gl_Position = vec4(position, 0.0, 1.0);
          }
        `;
      const fsSource = document.getElementById("fragShader").textContent;

      const createShader = (type, source) => {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);

        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error("Shader error:", gl.getShaderInfoLog(shader));
          gl.deleteShader(shader);
          return null;
        }
        return shader;
      };

      const vs = createShader(gl.VERTEX_SHADER, vsSource);
      const fs = createShader(gl.FRAGMENT_SHADER, fsSource);
      const program = gl.createProgram();

      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);
      gl.useProgram(program);

      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(
        gl.ARRAY_BUFFER,
        new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
        gl.STATIC_DRAW
      );

      const position = gl.getAttribLocation(program, "position");
      gl.enableVertexAttribArray(position);
      gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

      const uniforms = {
        resolution: gl.getUniformLocation(program, "iResolution"),
        time: gl.getUniformLocation(program, "iTime"),
        texture: gl.getUniformLocation(program, "iChannel0"),
      };

      const texture = gl.createTexture();

      let textureReady = false;
      const setupTexture = () => {
        if (img.src && img.complete) {
          gl.bindTexture(gl.TEXTURE_2D, texture);
          gl.texImage2D(
            gl.TEXTURE_2D,
            0,
            gl.RGBA,
            gl.RGBA,
            gl.UNSIGNED_BYTE,
            img
          );
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          textureReady = true;
        }
      };

      img.onload = setupTexture;

      const bgCanvas = captureBackground();
      img.src = bgCanvas.toDataURL();

      const startTime = performance.now();
      const render = () => {
        if (!textureReady) {
          requestAnimationFrame(render);
          return;
        }

        const currentTime = (performance.now() - startTime) / 1000;

        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.clear(gl.COLOR_BUFFER_BIT);

        gl.uniform3f(uniforms.resolution, canvas.width, canvas.height, 1.0);
        gl.uniform1f(uniforms.time, currentTime);

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.uniform1i(uniforms.texture, 0);

        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(render);
      };

      render();
    }
  </script>
</body>

</html>
